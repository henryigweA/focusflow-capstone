version: "3.9"

services:
  db:
    image: postgres:16
    container_name: focusflow-db
    environment:
      POSTGRES_USER: focus_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: focusflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: focusflow-backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: focusflow
      DB_USER: focus_user
      DB_PASSWORD: changeme
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: focusflow-frontend
    depends_on:
      - backend
    ports:
      - "8080:80" 

volumes:
  pgdata: